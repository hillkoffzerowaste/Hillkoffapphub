<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Hillkoff web app hub รวมลิงก์สำหรับเข้าใช้งานระบบ ESG, Delivery และ Packing"
    />
    <title>Hillkoff Web App Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">H</div>
        <p class="eyebrow">Hillkoff Group</p>
        <h1 id="page-title">Web App Hub</h1>
        <p class="lead">
          รวมทางเข้าเว็บแอพทั้ง 3 ระบบ สำหรับกดเปิดดูงานจากลิงก์กลางเดียว
        </p>
      </section>

      <section class="app-grid" aria-label="Hillkoff web applications">
        <a
          class="app-card"
          href="https://esg-platform-ten.vercel.app/?code=96275c60-85ab-4a93-b28f-67ee1f7a14af"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon-wrap icon-esg" aria-hidden="true">
            <i data-lucide="leaf"></i>
          </span>
          <span class="app-copy">
            <span class="app-title">Hillkoff ESG</span>
            <span class="app-desc">ระบบติดตามข้อมูล ESG และภาพรวมด้านความยั่งยืน</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <i data-lucide="external-link"></i>
          </span>
        </a>

        <a
          class="app-card"
          href="https://repo-rho-livid.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon-wrap icon-delivery" aria-hidden="true">
            <i data-lucide="truck"></i>
          </span>
          <span class="app-copy">
            <span class="app-title">Hillkoff Delivery System</span>
            <span class="app-desc">ระบบจัดการงานขนส่งและการส่งมอบสินค้า</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <i data-lucide="external-link"></i>
          </span>
        </a>

        <a
          class="app-card"
          href="https://hillkoffpacking-system-backend.vercel.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="icon-wrap icon-packing" aria-hidden="true">
            <i data-lucide="package-check"></i>
          </span>
          <span class="app-copy">
            <span class="app-title">Hillkoff Packing</span>
            <span class="app-desc">หน้าแดชบอร์ดสำหรับติดตามและจัดการงาน Packing</span>
          </span>
          <span class="open-icon" aria-hidden="true">
            <i data-lucide="external-link"></i>
          </span>
        </a>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      lucide.createIcons({
        attrs: {
          "stroke-width": 1.8
        }
      });
    </script>
  </body>
</html>
